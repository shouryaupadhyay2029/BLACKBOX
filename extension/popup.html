<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BLACKBOX Flight Recorder</title>
  <style>
    body {
      margin: 0;
      width: 320px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .row strong {
      color: #e2e8f0;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">⚡ BLACKBOX</span>
    <span class="badge" id="statusBadge">Checking...</span>
  </div>
  <div class="card">
    <div class="row"><span>Rolling Buffer:</span><strong id="bufEvents">-</strong></div>
    <div class="row"><span>Active Traces:</span><strong id="bufTraces">-</strong></div>
    <div class="row"><span>Git Branch:</span><strong id="gitBranch">-</strong></div>
    <div class="row"><span>Saved Capsules:</span><strong id="capCount">-</strong></div>
  </div>
  <button class="btn btn-primary" id="freezeBtn">❄️ Freeze Bug Capsule (Alt+Shift+B)</button>
  <button class="btn btn-secondary" id="openStudioBtn">Open Blackbox Studio ↗</button>
  <script src="popup.js"></script>
</body>
</html>
